<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachrichten</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         max-width: 680px; margin: 0 auto; padding: 24px 18px; line-height: 1.5;
         color: #1a1a1a; background: #ffffff; }
  a { color: #0b66d0; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: #888; font-size: 0.9rem; margin: 0 0 28px; }
  .empty { color: #888; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e6e6; background: #121212; }
    a { color: #6aa9ff; }
  }
</style>
</head>
<body>
  <h1>Nachrichten</h1>
  <p class="sub">Privater News-Digest · 2× täglich</p>
  <p class="empty">Noch kein Digest erstellt. Beim nächsten automatischen Lauf (10 bzw. 20 Uhr) erscheint hier die aktuelle Übersicht.</p>
</body>
</html>
