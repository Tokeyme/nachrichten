<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachrichten</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    max-width: 680px;
    margin: 0 auto;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 24px 18px;
    background: #ffffff;
    color: #1a1a1a;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 1.6em;
  }
  .stand {
    color: #777;
    font-size: 0.9em;
    margin-bottom: 24px;
  }
  .thema {
    margin: 0 0 4px 0;
    font-weight: bold;
  }
  p.text {
    margin: 0 0 20px 0;
  }
  a {
    color: #0060df;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  .ruhig {
    color: #777;
    font-size: 0.9em;
    margin-top: 28px;
  }
  .warnung {
    background: #c62828;
    color: #ffffff;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-weight: bold;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background: #121212;
      color: #e6e6e6;
    }
    a {
      color: #6aa9ff;
    }
    .stand, .ruhig {
      color: #999;
    }
  }
</style>
</head>
<body data-stand="2026-11-03T08:06:48Z">

<h1>Nachrichten</h1>
<div class="stand">aktualisiert: 03.11.2026, 09:06 Uhr</div>

<div class="ruhig">Ruhig, nichts Grosses mit verlaesslicher aktueller Quelle gefunden: Ukraine/Russland, Iran/USA, AfD, VfB Stuttgart, Guild Wars 2, Weltraum, Wissenschaft/Forschung, KI, Bitcoin, Computer/Hardware, Apps, Apple, Lorch (Württemberg).</div>

<script>
try {
  var stand = document.body.getAttribute('data-stand');
  var standDate = new Date(stand);
  var stunden = (Date.now() - standDate.getTime()) / 3600000;
  if (stunden > 18) {
    var zeile = document.createElement('div');
    zeile.className = 'warnung';
    zeile.textContent = 'Diese Seite ist seit ' + Math.floor(stunden) + ' Stunden nicht aktualisiert worden - die Routine laeuft nicht.';
    document.body.insertBefore(zeile, document.body.firstChild);
  }
} catch (e) {}
</script>

</body>
</html>
